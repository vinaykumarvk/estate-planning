name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:push
      - run: npm run db:seed
      - run: npm run lint:requirements
      - run: npm test
      - run: npm run typecheck
      - run: npm audit --audit-level=moderate
      - run: npm run build
